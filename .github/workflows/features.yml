# Text-change features and own-period XBRL values for all paired reports (Step 2). Started by hand only.
# 6 shards run at the same time, each at 1.3 SEC requests per second: 7.8 per second in total (SEC limit: 10).
# The inputs (universe and report index; public SEC metadata, no prices) come from a private release. The outputs are
# private workflow artifacts. Every step continues on error, so a failed run sends no email; the shard summary tells.
name: features
on:
  workflow_dispatch:
    inputs:
      release:
        description: "release tag with universe.parquet and filings_index.parquet"
        default: "inputs-2026-11-16"
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
        continue-on-error: true
      - name: inputs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release }}" --dir data --pattern "*.parquet"
      - name: extract
        continue-on-error: true
        timeout-minutes: 335
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u scripts/data/extract_text_features.py --shard ${{ matrix.shard }} --nshards 6 --per-sec 1.3
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: features-shard-${{ matrix.shard }}
          path: data/features/
          retention-days: 30
