# The live job and the whole Pages site (decision D15). Silent: every step continues on error; the result of each
# mode is in live.json and on the page, so a failed step sends no email.
#   21:40 UTC weekdays        score (new reports) + site
#   13:40/14:40/15:40 wkdays  trade (the script trades only on the first session of a month or on an empty
#                             account, 0-150 min after the open; a minute or less on other days)
#   repo variable TRADING     "off" stops all new orders (kill switch); mode "flatten" closes every position (it
#                             runs even when TRADING is off)
#   push to docs/web          site only
#   manual                    any mode
name: live
on:
  schedule:
    - cron: "40 21 * * 1-5"         # score after the close
    - cron: "40 23 * * 1-5"         # second score (a GitHub schedule can be dropped; a rerun scores only new pairs)
    - cron: "5,25,45 13-16 * * 1-5" # trade checks every 20 min (a rerun trades nothing)
  push:
    branches: [main]
    paths: ["docs/**", "web/**", "mkdocs.yml", ".github/workflows/live.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "score, trade, flatten or site"
        default: site
permissions:
  contents: write  # upload the encrypted trade record to the release `live-state` (no commit; D25)
  pages: write
  id-token: write
concurrency:
  group: live
  cancel-in-progress: false  # never stop a running rebalance
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt && pip install --no-deps -e .  # pinned (requirements-live.txt)
        continue-on-error: true
      - id: mode
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT:$SCHEDULE" in
            "schedule:40 21 * * 1-5"|"schedule:40 23 * * 1-5") m=score ;;
            schedule:*) m=trade ;;
            workflow_dispatch:*) m="$INPUT_MODE" ;;
            *) m=site ;;
          esac
          case "$m" in score|trade|flatten|site) ;; *) m=site ;; esac  # only known modes reach the shell
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/live
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - name: restore from the release if the cache is lost
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # The release holds only encrypted files (*.enc, D25); they are decrypted with the STATE_KEY secret.
          if [ ! -f data/live/scores.parquet ] && [ -n "$STATE_KEY" ]; then
            mkdir -p data/live "$RUNNER_TEMP/state"
            gh release download live-state --dir "$RUNNER_TEMP/state" --pattern '*.enc' --clobber
            for f in "$RUNNER_TEMP"/state/*.enc; do
              openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 100000 -pass env:STATE_KEY \
                -in "$f" -out "data/live/$(basename "${f%.enc}")"
            done
            echo "restored from release"
          fi
      - name: score
        if: steps.mode.outputs.mode == 'score'
        continue-on-error: true
        timeout-minutes: 45
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u scripts/live_desk.py score
      - name: trade
        if: (steps.mode.outputs.mode == 'trade' && vars.TRADING != 'off') || steps.mode.outputs.mode == 'flatten'
        continue-on-error: true
        timeout-minutes: 180
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u scripts/live_desk.py ${{ steps.mode.outputs.mode }}
      - name: trading is off
        if: steps.mode.outputs.mode == 'trade' && vars.TRADING == 'off'
        continue-on-error: true
        run: python -u scripts/live_desk.py off
      - name: site data
        continue-on-error: true
        timeout-minutes: 10
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u scripts/live_desk.py site
      - name: keep the trade record in the release
        if: always() && steps.mode.outputs.mode != 'site'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # The repository is public, so only encrypted copies go to the release (D25). No key: no upload.
          if [ -z "$STATE_KEY" ]; then echo "::warning::STATE_KEY is not set; the trade record was not uploaded"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/enc"
          for f in data/live/*.json data/live/*.parquet; do
            openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 -iter 100000 -pass env:STATE_KEY \
              -in "$f" -out "$RUNNER_TEMP/enc/$(basename "$f").enc"
          done
          gh release upload live-state "$RUNNER_TEMP"/enc/*.enc --clobber
      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.mode != 'site'
        continue-on-error: true
        with:
          path: data/live
          key: live-state-${{ github.run_id }}
      - name: build site
        continue-on-error: true
        run: |
          mkdir -p _site/data
          cp -R web/. _site/
          cp site-data/live.json _site/data/live.json || true
          mkdocs build --strict -q -d _site/docs
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
