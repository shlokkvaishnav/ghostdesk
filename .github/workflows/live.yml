# The nightly live job and the whole Pages site (decision D30). Silent: every step continues on error; the result
# of each mode is in live.json and on the page, so a failed step sends no email.
#   main trigger      the Cloudflare Worker (worker/, D36) dispatches mode=night at 01:30 and 11:00 UTC Tue-Sat
#   backup schedule   the same two times + 30 min (GitHub starts schedules late; a run for a done session does
#                     nothing, so a duplicate is harmless)
#   repo variable TRADING   "off" = kill switch: predictions still go to the ledger, no order is sent
#   mode flatten      closes every position (runs even when TRADING is off)
#   push to web/docs  site only
name: live
on:
  schedule:
    - cron: "0 2 * * 2-6"
    - cron: "30 11 * * 2-6"
  push:
    branches: [main]
    paths: ["docs/**", "web/**", "mkdocs.yml", ".github/workflows/live.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "night, flatten or site"
        default: site
permissions:
  contents: write  # upload the encrypted live state to the release `live-state` (no commit; D25)
  pages: write
  id-token: write
concurrency:
  group: live
  cancel-in-progress: false  # never stop a running night
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt && pip install --no-deps -e .
        continue-on-error: true
      - id: mode
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT" in
            schedule) m=night ;;
            workflow_dispatch) m="$INPUT_MODE" ;;
            *) m=site ;;
          esac
          case "$m" in night|flatten|site) ;; *) m=site ;; esac  # only known modes reach the shell
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/live
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - name: restore from the release if the cache is lost
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # The release holds only the encrypted state archive (D25), decrypted with the STATE_KEY secret.
          if [ ! -f data/live/models/meta.json ] && [ -n "$STATE_KEY" ]; then
            mkdir -p data/live "$RUNNER_TEMP/state"
            gh release download live-state --dir "$RUNNER_TEMP/state" --pattern 'live-state.tar.enc' --clobber
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 100000 -pass env:STATE_KEY \
              -in "$RUNNER_TEMP/state/live-state.tar.enc" | tar -x -C data/live
            echo "restored from release"
          fi
      - name: night
        if: steps.mode.outputs.mode == 'night'
        continue-on-error: true
        timeout-minutes: 40
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING: ${{ vars.TRADING }}
        run: python -u scripts/live_desk.py night
      - name: flatten
        if: steps.mode.outputs.mode == 'flatten'
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u scripts/live_desk.py flatten
      - name: site data
        continue-on-error: true
        timeout-minutes: 10
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u scripts/live_desk.py site
      - name: keep the live state in the release
        if: always() && steps.mode.outputs.mode != 'site'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # The repository is public, so only an encrypted archive goes to the release (D25). No key: no upload.
          if [ -z "$STATE_KEY" ]; then echo "::warning::STATE_KEY is not set; the live state was not uploaded"; exit 0; fi
          tar -C data/live -c . | openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 -iter 100000 \
            -pass env:STATE_KEY -out "$RUNNER_TEMP/live-state.tar.enc"
          gh release upload live-state "$RUNNER_TEMP/live-state.tar.enc" --clobber
      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.mode != 'site'
        continue-on-error: true
        with:
          path: data/live
          key: live-state-${{ github.run_id }}
      - name: build site
        continue-on-error: true
        run: |
          mkdir -p _site/data
          cp -R web/. _site/
          cp site-data/live.json _site/data/live.json || true
          mkdocs build --strict -q -d _site/docs
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
