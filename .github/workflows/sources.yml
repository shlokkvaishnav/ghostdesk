# Downloads public reference files that the owner's network cannot reach (the Kenneth French data library answers
# 404 to it), and keeps them as a private artifact. Started by hand. No failing steps (no emails).
name: sources
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fama-French factors (monthly 5 factors 2x3, momentum)
        continue-on-error: true
        run: |
          mkdir -p sources
          base=https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp
          for f in F-F_Research_Data_5_Factors_2x3_CSV.zip F-F_Momentum_Factor_CSV.zip; do
            curl -sS -f -A "ghostdesk-research/0.1" -o "sources/$f" "$base/$f" && echo "$f $(wc -c < sources/$f) bytes"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: sources
          path: sources/
          retention-days: 30
