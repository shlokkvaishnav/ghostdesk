site_name: Ghostdesk
site_url: https://shlokkvaishnav.github.io/ghostdesk/docs/
repo_url: https://github.com/shlokkvaishnav/ghostdesk
repo_name: shlokkvaishnav/ghostdesk
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Engineering: engineering.md
  - Plan: plan.md
  - Data: data.md
  - Pre-registration: preregistration.md
  - Results: results.md
  - Research note: note.md
  - Development:
      - Status: dev/status.md
      - Architecture: dev/architecture.md
      - Modules: dev/modules.md
      - Data contracts: dev/data-contracts.md
      - Runbook: dev/runbook.md
      - Data quality: dev/data-quality.md
      - Decisions: dev/decisions.md
      - Conventions: dev/conventions.md
