site_name: Ghostdesk
site_url: https://shlokkvaishnav.github.io/ghostdesk/
repo_url: https://github.com/shlokkvaishnav/ghostdesk
repo_name: shlokkvaishnav/ghostdesk
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Plan: plan.md
