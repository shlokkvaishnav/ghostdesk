[project]
name = "ghostdesk"
version = "0.1.0"
description = "A trading desk with no people at it: point-in-time US stock data, pre-registered tests of a text signal and ML return models, and live paper trading"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "requests", "gymnasium", "lxml"]

[project.optional-dependencies]
ml = ["torch", "stable-baselines3", "lightgbm"]
dev = ["pytest", "ruff", "mkdocs-material==9.5.39", "lightgbm", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]
