[project]
name = "ghostdesk"
version = "0.1.0"
description = "A quant research platform for next-day S&P 500 prediction: point-in-time store, expression-language features, model zoo, walk-forward backtests, optimizer, and a nightly paper-trading loop"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "requests", "lxml", "scipy", "duckdb", "cvxpy", "lightgbm"]

[project.optional-dependencies]
ml = ["torch"]
dev = ["pytest", "ruff", "mypy", "mkdocs-material==9.5.39", "lightgbm", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

# Scoped type check: only the forward-evaluation modules (D37). Not a claim about the rest of the code.
[tool.mypy]
files = ["src/ghostdesk/live/evaluate.py", "src/ghostdesk/live/portfolio.py", "src/ghostdesk/live/compare.py"]
ignore_missing_imports = true
follow_imports = "silent"
