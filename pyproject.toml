[project]
name = "ghostdesk"
version = "0.1.0"
description = "A trading desk with no people at it: a filing signal, an RL execution agent and live paper trading on US stocks"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "requests", "gymnasium", "pyyaml", "beautifulsoup4", "lxml"]

[project.optional-dependencies]
ml = ["torch", "stable-baselines3"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["experimental"]

[tool.ruff.lint]
extend-select = ["I"]
